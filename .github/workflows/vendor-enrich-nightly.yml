name: Vendor Enrichment (nightly)

# Verrijkt elke nacht 5 vendor-pages met unieke "Stevin-invalshoek +
# stack-impact + pitfalls" content via Claude Sonnet 4.6 API.
#
# 245 vendors / 5 per nacht = 49 dagen tot alles verrijkt is.
# Cost-schatting: ~$0.015 per vendor × 5 = $0.075/nacht = ~$3.50 totaal.
#
# Output: PR per nacht. Niet auto-merged — review wenselijk vóór deploy.
#
# VEREIST: ANTHROPIC_API_KEY als GitHub Secret (Settings → Secrets and
# variables → Actions → New repository secret).

on:
  schedule:
    # 04:00 UTC = 06:00 Europe/Amsterdam (CEST)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Aantal vendors deze run (default 5)'
        required: false
        default: '5'
      slug:
        description: 'Specifieke vendor-slug (overschrijft count)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  enrich:
    name: Enrich vendor batch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --no-audit --no-fund

      - name: Run vendor enrichment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            npm run vendor:enrich -- "${{ github.event.inputs.slug }}"
          else
            COUNT="${{ github.event.inputs.count || '5' }}"
            npm run vendor:enrich -- --count "$COUNT"
          fi

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet data/article-faqs.json data/related-articles.json data/vendor-enrichments.json 2>/dev/null && git diff --quiet data/vendor-enrichments.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "[Workflow] Geen wijzigingen — niets te committen"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat data/vendor-enrichments.json
          fi

      - name: Validate JSON-LD
        if: steps.check.outputs.changed == 'true'
        run: npm run validate:schema

      - name: Create PR with enrichments
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="auto/vendor-enrich-$DATE"
          ENRICHED_COUNT=$(jq 'to_entries | map(select(.value.stevinAngle)) | length' data/vendor-enrichments.json)
          TOTAL=$(jq '. | length' data/integrations.ts 2>/dev/null || echo "245")

          git config user.name "Stevin Hub Bot"
          git config user.email "redactie@stevin.io"
          git checkout -b "$BRANCH"
          git add data/vendor-enrichments.json
          git commit -m "feat(seo): nightly vendor enrichment batch ($DATE)

          Geautomatiseerde batch-verrijking van vendor-pages met unieke
          Stevin-invalshoek + stack-impact + pitfalls content.

          Status na deze batch: $ENRICHED_COUNT / 245 vendors verrijkt.

          Generated by .github/workflows/vendor-enrich-nightly.yml
          Model: Claude Sonnet 4.6"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "feat(seo): vendor enrichment batch — $DATE" \
            --body "Automatische nightly batch (~5 vendors). Status: **$ENRICHED_COUNT / 245** verrijkt.

          Review per vendor:
          - Tone klopt (geen jargon, geen em-dash)?
          - Pitfalls zijn concreet en niet generiek?
          - StevinAngle bevat geen verzonnen cijfers?

          Goedkeuring → squash + merge → CLI deploy via \`npx vercel --prod --yes\` of wacht op auto-deploy.

          🤖 Auto-generated nightly via Claude Sonnet 4.6"
