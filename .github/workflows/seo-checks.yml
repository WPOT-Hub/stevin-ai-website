name: SEO Checks

on:
  pull_request:
    paths:
      - 'data/articles.ts'
      - 'app/**/page.tsx'
      - 'scripts/validate-jsonld.ts'
  push:
    branches: [main]
    paths:
      - 'data/articles.ts'
      - 'app/**/page.tsx'
      - 'scripts/validate-jsonld.ts'

jobs:
  validate-jsonld:
    name: Validate Article JSON-LD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
      # npm install ipv ci — tolerant voor minor lock-drift,
      # validator hangt alleen op data/articles.ts en tsx (geen runtime deps)
      - run: npm install --no-audit --no-fund
      - run: npm run validate:schema
