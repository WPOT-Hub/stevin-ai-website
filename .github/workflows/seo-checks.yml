name: SEO Checks

on:
  pull_request:
    paths:
      - 'data/articles.ts'
      - 'app/**/page.tsx'
      - 'scripts/validate-jsonld.ts'
  push:
    branches: [main]
    paths:
      - 'data/articles.ts'
      - 'app/**/page.tsx'
      - 'scripts/validate-jsonld.ts'

jobs:
  validate-jsonld:
    name: Validate Article JSON-LD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      # npm install ipv ci — tolerant voor minor lock-drift,
      # validator hangt alleen op data/articles.ts en tsx (geen runtime deps)
      - run: npm install --no-audit --no-fund
      - run: npm run validate:schema
