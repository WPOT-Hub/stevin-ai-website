name: SEO Checks

on:
  pull_request:
    paths:
      - 'data/articles.ts'
      - 'data/**'
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'app/**/page.tsx'
      - 'scripts/validate-jsonld.ts'
      - 'scripts/verify-production-release.ts'
  push:
    branches: [main]
    paths:
      - 'data/articles.ts'
      - 'data/**'
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'app/**/page.tsx'
      - 'scripts/validate-jsonld.ts'
      - 'scripts/verify-production-release.ts'

jobs:
  validate-jsonld:
    name: Validate Article JSON-LD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
      # npm install ipv ci — tolerant voor minor lock-drift,
      # validator hangt alleen op data/articles.ts en tsx (geen runtime deps)
      - run: npm install --no-audit --no-fund
      - run: npm run validate:schema
      - run: npm run check:sitemap:structuur
