name: SEO Checks

on:
  pull_request:
    paths:
      - 'data/articles.ts'
      - 'data/**'
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'app/**/page.tsx'
      - 'scripts/validate-jsonld.ts'
      - 'scripts/verify-production-release.ts'
  push:
    branches: [main]
    paths:
      - 'data/articles.ts'
      - 'data/**'
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'app/**/page.tsx'
      - 'scripts/validate-jsonld.ts'
      - 'scripts/verify-production-release.ts'

jobs:
  validate-jsonld:
    name: Validate Article JSON-LD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
      # npm install ipv ci — tolerant voor minor lock-drift,
      # validator hangt alleen op data/articles.ts en tsx (geen runtime deps)
      - run: npm install --no-audit --no-fund
      - run: npm run validate:schema
      - run: npm run check:sitemap:structuur
