name: Vercel Production Deploy

# Robuuste fallback voor Vercel's auto-deploy. Triggert bij elke push naar
# main (vooral nuttig voor auto-publish via Stevin Journal Slack-flow, want
# de deploy-hook in publisher.ts mist soms commits).
#
# Vereist GitHub repo secrets:
#   VERCEL_TOKEN      (Personal Access Token uit Vercel → Settings → Tokens)
#   VERCEL_ORG_ID     team_XKLV3prli8Cxl4PiSnksdPOY (al bekend, hardcoded ok)
#   VERCEL_PROJECT_ID prj_k1uDT6yiLQxMvEuWhaAgXd2FF4vo (al bekend, hardcoded ok)
#
# Workflow draait ALLEEN als de commit data/articles.ts of de page-template
# raakt — dus normale config-pushes geven geen overbodige deploy.

on:
  workflow_dispatch: # voor handmatige triggers via gh CLI of UI
  push:
    branches: [main]
    paths:
      - 'data/articles.ts'
      - 'app/[locale]/blog/[slug]/page.tsx'
      - 'messages/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tailwind.config.ts'

env:
  VERCEL_ORG_ID: team_XKLV3prli8Cxl4PiSnksdPOY
  VERCEL_PROJECT_ID: prj_k1uDT6yiLQxMvEuWhaAgXd2FF4vo

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact (auto-promote naar production domain)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

      - name: Smoke-test live homepage
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://stevin.ai)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Homepage returned $STATUS (expected 200) — check Vercel project production domain settings"
            exit 1
          fi
          echo "Homepage 200 OK"
